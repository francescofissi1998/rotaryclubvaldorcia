<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata — Rotary Club Val d'Orcia</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#071B33">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
/* Foglio di stile incorporato per non bloccare il primo disegno.
   Sorgente modificabile: css/legal.css nel repository di lavoro. */
/* Stile pagine legali — Rotary Club Val d'Orcia
   Allineato alla landing page (def). Font self-ospitato: nessuna richiesta a server terzi. */
@font-face{font-family:'Inter';font-style:normal;font-weight:400 900;font-display:swap;
  src:url(fonts/inter-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 900;font-display:swap;
  src:url(fonts/inter-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

:root{
  --navy:#071B33; --royal:#0C2A50; --azure:#0A6BD4; --gold:#FFC02E;
  --ink:#5D6E85; --line:#E6EDF6; --mist:#F4F8FD;
  --frame:1440px; --pad:80px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--royal);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--frame);margin:0 auto;padding:0 var(--pad)}

/* ---------- nav (identica alla landing) ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:60;transition:background .35s ease,box-shadow .35s ease,padding .35s ease;padding:22px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo img{height:54px;width:auto}
.logo .blue{display:none}
nav.links{display:flex;align-items:center;gap:32px}
nav.links a{font-size:14px;font-weight:500;color:#fff;opacity:.92;transition:opacity .2s,color .2s}
nav.links a:hover{opacity:1}
.nav-cta{background:var(--gold);color:var(--navy)!important;padding:12px 22px;border-radius:4px;font-weight:600;font-size:13.5px;transition:transform .2s}
.nav-cta:hover{transform:translateY(-2px)}
header.stuck{background:rgba(255,255,255,.94);backdrop-filter:saturate(1.5) blur(12px);box-shadow:0 1px 0 var(--line),0 10px 30px rgba(12,42,80,.06);padding:12px 0}
header.stuck .logo .white{display:none}
header.stuck .logo .blue{display:block}
header.stuck nav.links a{color:var(--royal)}
.burger{display:none;background:none;border:0;cursor:pointer;padding:8px}
.burger span{display:block;width:24px;height:2px;background:#fff;margin:5px 0;transition:.3s}
header.stuck .burger span{background:var(--royal)}

/* ---------- intestazione documento ---------- */
.dochead{background:var(--navy);color:#fff;padding:190px 0 84px}
.dochead .lbl{display:inline-flex;align-items:center;gap:11px;font-size:12.5px;font-weight:700;letter-spacing:3.6px;color:#fff}
.dochead .lbl::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.dochead h1{font-size:clamp(36px,5.8vw,72px);font-weight:900;letter-spacing:-.038em;line-height:1.02;margin:26px 0 22px}
.dochead h1 em{font-style:normal;color:var(--gold)}
.dochead p{font-size:17.5px;line-height:1.66;color:rgba(255,255,255,.85);max-width:660px}
.dochead .upd{margin-top:30px;display:inline-flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);padding:12px 22px;border-radius:40px}
.dochead .upd i{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}

/* ---------- documento ---------- */
.doc{padding:80px 0 120px}
.doc .wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:74px;align-items:start}
.toc{position:sticky;top:104px}
.toc h4{font-size:11.5px;font-weight:700;letter-spacing:2.4px;color:var(--azure);margin-bottom:18px}
.toc a{display:block;font-size:14px;color:var(--ink);padding:8px 0 8px 14px;border-left:2px solid var(--line);transition:.2s}
.toc a:hover{color:var(--royal);border-color:var(--gold)}
article{max-width:760px}
article section{padding-bottom:46px;scroll-margin-top:110px}
article h2{font-size:clamp(22px,2.4vw,28px);font-weight:900;letter-spacing:-.028em;line-height:1.24;margin-bottom:16px;color:var(--royal)}
article h2 .n{color:var(--azure);margin-right:10px}
article h3{font-size:17.5px;font-weight:700;margin:26px 0 10px;color:var(--royal)}
article p{font-size:16.5px;line-height:1.78;color:#43536b;margin-bottom:14px}
article ul{margin:8px 0 16px;padding-left:22px}
article li{font-size:16.5px;line-height:1.72;color:#43536b;margin-bottom:9px}
article a{color:var(--azure);font-weight:500;text-decoration:underline;text-underline-offset:2px}
article a:hover{color:var(--royal)}
article strong{font-weight:700;color:var(--royal)}

.callout{background:var(--mist);border-left:4px solid var(--azure);border-radius:0 10px 10px 0;padding:24px 28px;margin:20px 0 26px}
.callout p{margin:0;font-size:16px}
.callout.good{border-left-color:#1F9254;background:#F1F9F4}
.callout.warn{border-left-color:var(--gold);background:#FFF8E8}
.callout h4{font-size:15px;font-weight:800;margin-bottom:8px;color:var(--royal)}
.fill{background:#FFF8E8;border:1px dashed #E3B23C;border-radius:10px;padding:20px 24px;margin:18px 0}
.fill b{color:#8A6100}

table{width:100%;border-collapse:collapse;margin:18px 0 26px;font-size:15px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
th{font-size:11.5px;font-weight:700;letter-spacing:1.6px;color:var(--azure);text-transform:uppercase;border-bottom:2px solid var(--line)}
td{color:#43536b}
td b{color:var(--royal)}

/* ---------- footer (identico alla landing) ---------- */
footer{background:#fff;border-top:1px solid var(--line);padding:96px 0 44px}
.f-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr;gap:60px}
.f-brand img{height:60px;width:auto;margin-bottom:26px}
.f-brand p{font-size:15px;line-height:1.73;color:var(--ink);max-width:380px}
.social{display:flex;gap:12px;margin-top:26px}
.social a{width:44px;height:44px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--royal);transition:background .2s,transform .2s}
.social a:hover{background:#e2ecf9;transform:translateY(-2px)}
.social svg{width:20px;height:20px}
.fcol h4{font-size:11.5px;font-weight:700;letter-spacing:2.6px;color:var(--azure);margin-bottom:22px}
.fcol a,.fcol p{display:block;font-size:15px;color:var(--royal);margin-bottom:14px;line-height:1.6}
.fcol a{transition:color .2s}
.fcol a:hover{color:var(--azure)}
.fcol p.muted{color:var(--ink)}
.f-div{height:1px;background:var(--line);margin:56px 0 26px}
.f-bot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;font-size:13.5px;color:var(--ink)}
.f-bot .lks{display:flex;gap:30px}
.f-bot a:hover{color:var(--azure)}
.trademark{margin-top:22px;font-size:12.5px;line-height:1.7;color:var(--ink);max-width:900px}

@media (max-width:1080px){:root{--pad:48px}
  .doc .wrap{grid-template-columns:1fr;gap:36px}
  .toc{position:static}
  .toc a{display:inline-block;border-left:0;border-bottom:2px solid var(--line);padding:6px 14px 6px 0;margin-right:8px}
  .f-top{grid-template-columns:1fr 1fr;gap:44px}.f-brand{grid-column:1/-1}}
@media (max-width:860px){
  nav.links{position:fixed;inset:0 0 auto;top:0;background:#fff;flex-direction:column;align-items:flex-start;gap:0;padding:96px 32px 32px;transform:translateY(-100%);transition:transform .4s cubic-bezier(.2,.7,.2,1);box-shadow:0 20px 50px rgba(12,42,80,.14)}
  nav.links.open{transform:none}
  nav.links a{color:var(--royal)!important;font-size:19px;font-weight:600;padding:16px 0;width:100%;border-bottom:1px solid var(--line)}
  nav.links .nav-cta{margin-top:20px;border-bottom:0;width:auto}
  .burger{display:block;z-index:70}
  .dochead{padding:150px 0 64px}}
@media (max-width:640px){:root{--pad:22px}
  .doc{padding:48px 0 70px}
  .f-top{grid-template-columns:1fr}
  .f-bot{flex-direction:column;align-items:flex-start}
  table,thead,tbody,th,td,tr{display:block}thead{display:none}
  td{border:0;padding:4px 0}tr{border-bottom:1px solid var(--line);padding:14px 0;display:block}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}nav.links{transition:none}}
</style>
</head>
<body id="top">
<header id="hdr" class="stuck">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Rotary Club Val d'Orcia Community — home">
      <img class="white" src="images/logo-white.png" alt="Rotary Club Val d'Orcia Community">
      <img class="blue" src="images/logo-blue.png" alt="Rotary Club Val d'Orcia Community">
    </a>
    <nav class="links" id="menu"><a class="nav-cta" href="index.html">Torna alla home</a></nav>
  </div>
</header>
<section class="dochead" style="padding:200px 0 120px">
  <div class="wrap">
    <h1>Pagina non trovata</h1>
    <p>La pagina che cerchi non esiste o è stata spostata.</p>
    <div class="upd"><i></i><span><a href="index.html" style="color:#fff">Torna alla home &rarr;</a></span></div>
  </div>
</section>
<script src="js/legal.js"></script>
</body>
</html>
