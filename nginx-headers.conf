# ==========================================================
#  Header di sicurezza — snippet nginx
#  Da consegnare all'assistenza Register.it, oppure da inserire
#  nel blocco  server { ... }  del dominio.
# ==========================================================

# 1. HSTS — iniziare con max-age=300, poi salire a 31536000
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 2. Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; require-trusted-types-for 'script'; upgrade-insecure-requests" always;

# 3. Anti clickjacking
add_header X-Frame-Options "DENY" always;

# 4. Niente MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# 5. Referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6. Isolamento origine
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# 7. Permissions-Policy
add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

server_tokens off;
gzip on;
gzip_types text/css application/javascript application/xml image/svg+xml text/plain application/manifest+json;

# ---------- Redirect HTTP -> HTTPS ----------
# server {
#     listen 80;
#     server_name rotaryclubvaldorcia.it www.rotaryclubvaldorcia.it;
#     return 301 https://$host$request_uri;
# }

# ---------- Expires / Cache ----------
location ~* \.(css|js|jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location ~* \.(html|xml|txt|webmanifest)$ {
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}
